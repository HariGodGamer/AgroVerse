<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disease Detection — AgroVerse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --emerald: #00e5a0;
    --teal: #00c9b1;
    --cyan: #00d4ff;
    --bg-dark: #050e0a;
    --bg-mid: #091a12;
    --glass-border: rgba(0, 229, 160, 0.15);
    --text-main: #e8f5ee;
    --text-muted: #7aa390;
    --glow: 0 0 40px rgba(0, 229, 160, 0.25);
    --sidebar-w: 220px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
    display: flex;
    height: 100vh;
  }

.main-area {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .topbar {
    padding: 20px 28px;
    background: var(--bg-mid);
    border-bottom: 1px solid var(--glass-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .topbar h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--emerald), var(--cyan));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .back-btn {
    padding: 10px 16px;
    background: rgba(0,229,160,0.1);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: var(--emerald);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
  }
  .back-btn:hover {
    background: rgba(0,229,160,0.2);
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
  }

  .card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 32px;
    max-width: 700px;
    margin: 0 auto;
  }

  .upload-zone {
    border: 2px dashed var(--glass-border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all .3s;
    position: relative;
    background: rgba(0,229,160,0.03);
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--emerald);
    background: rgba(0,229,160,0.1);
  }
  .upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-zone .icon { font-size: 2.2rem; margin-bottom: 12px; }
  .upload-zone p { color: var(--text-muted); font-size: .9rem; margin: 0; }
  .upload-zone span { color: var(--emerald); font-weight: 600; }

  .upload-options {
    display: flex;
    gap: 12px;
    margin-top: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .upload-btn {
    padding: 12px 20px;
    background: rgba(0,229,160,0.1);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    color: var(--emerald);
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }
  .upload-btn:hover {
    background: rgba(0,229,160,0.2);
    transform: translateY(-1px);
  }

  .camera-btn {
    background: rgba(0,201,177,0.1);
    border-color: rgba(0,201,177,0.3);
    color: var(--teal);
  }
  .camera-btn:hover {
    background: rgba(0,201,177,0.2);
  }

  #preview-wrap {
    display: none;
    margin-top: 20px;
    text-align: center;
  }
  #preview-img {
    max-height: 220px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    object-fit: cover;
    max-width: 100%;
  }
  #file-name {
    font-size: .8rem;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .btn-analyze {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: linear-gradient(135deg, var(--emerald), var(--teal));
    color: #050e0a;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: .5px;
    transition: all .3s;
  }
  .btn-analyze:hover { transform: translateY(-2px); box-shadow: var(--glow); }
  .btn-analyze:disabled { opacity: 0.5; cursor: not-allowed; }

  .spinner {
    display: none;
    width: 28px; height: 28px;
    border: 3px solid var(--glass-border);
    border-top-color: var(--emerald);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 24px auto 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error-box {
    display: none;
    background: rgba(255,80,80,0.1);
    border: 1px solid rgba(255,80,80,0.3);
    border-radius: 10px;
    padding: 14px;
    color: #ff5050;
    font-size: .88rem;
    margin-top: 18px;
  }

  #result {
    display: none;
    margin-top: 24px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: 700;
    font-size: .9rem;
    margin: 20px 0;
  }
  .badge-healthy {
    background: rgba(0,229,160,0.15);
    color: var(--emerald);
    border: 1px solid rgba(0,229,160,0.3);
  }
  .badge-diseased {
    background: rgba(244,160,58,0.15);
    color: #f4a03a;
    border: 1px solid rgba(244,160,58,0.3);
  }

  .result-label {
    font-family: 'Syne', sans-serif;
    font-size: 1.35rem;
    font-weight: 700;
    margin: 14px 0;
    color: var(--text-main);
  }
  .result-conf {
    color: var(--text-muted);
    font-size: .85rem;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--glass-border);
    margin: 20px 0;
  }

  .advice-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: .95rem;
    color: var(--emerald);
    margin: 12px 0;
    letter-spacing: .3px;
  }
  #advice-text {
    font-size: .9rem;
    line-height: 1.75;
    color: var(--text-muted);
    white-space: pre-wrap;
  }

  @media (max-width: 768px) {
    .main-area { margin-left: 0; }
    .sidebar { width: 0; }
    .topbar {
      padding: 16px;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }
    .topbar h1 { font-size: 24px; }
    .back-btn {
      align-self: flex-end;
      padding: 8px 12px;
      font-size: 0.9rem;
    }
    .content { padding: 16px; }
    .card { padding: 20px; }
    .upload-zone { padding: 30px 15px; }
    .upload-zone .icon { font-size: 2rem; }
    .upload-options {
      flex-direction: column;
      gap: 8px;
    }
    .upload-btn {
      padding: 14px 20px;
      font-size: 1rem;
      justify-content: center;
    }
    #camera-video {
      width: 100% !important;
      max-width: none !important;
    }
    .result-label { font-size: 1.2rem; }
    .advice-title { font-size: 1rem; }
    #advice-text { font-size: 1rem; line-height: 1.6; }
  }

  @media (max-width: 480px) {
    .topbar h1 { font-size: 20px; }
    .card { padding: 16px; }
    .upload-zone { padding: 25px 12px; }
    .upload-zone p { font-size: 0.85rem; }
    .badge { padding: 6px 12px; font-size: 0.8rem; }
    .result-label { font-size: 1.1rem; }
    .btn-analyze { padding: 12px; font-size: 0.95rem; }
  }
</style>
</head>
<body>

{% include 'sidebar.html' %}


<div class="main-area">
  <div class="topbar">
    <div>
      <h1>🔬 Plant Disease Detection</h1>
      <p style="color: var(--text-muted); margin-top: 4px; font-size: 14px;">Upload a clear leaf photo to diagnose diseases instantly</p>
    </div>
    <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
  </div>

  <div class="content">
    <div class="card">
      <!-- Upload zone -->
      <div class="upload-zone" id="drop-zone">
        <input type="file" id="file-input" accept="image/*" />
        <div class="icon">📷</div>
        <p>Drag & drop a leaf image here<br>or <span>click to browse</span></p>
      </div>

      <!-- Upload options -->
      <div class="upload-options">
        <button class="upload-btn camera-btn" id="camera-btn">
          📷 Take Photo
        </button>
        <button class="upload-btn" id="gallery-btn">
          🖼️ Choose from Gallery
        </button>
      </div>

      <!-- Camera capture -->
      <div id="camera-container" style="display: none; margin-top: 20px;">
        <video id="camera-video" autoplay playsinline style="width: 100%; max-width: 400px; border-radius: 10px; border: 1px solid var(--glass-border);"></video>
        <div style="display: flex; gap: 10px; margin-top: 15px; justify-content: center;">
          <button class="upload-btn" id="capture-btn" style="background: rgba(0,229,160,0.15); color: var(--emerald);">📸 Capture</button>
          <button class="upload-btn" id="cancel-camera-btn" style="background: rgba(255,80,80,0.1); color: #ff5050; border-color: rgba(255,80,80,0.3);">❌ Cancel</button>
        </div>
      </div>

      <!-- Preview -->
      <div id="preview-wrap">
        <img id="preview-img" src="" alt="Leaf preview" />
        <p id="file-name"></p>
      </div>

      <!-- Analyze button -->
      <button id="analyze-btn" class="btn-analyze" disabled>Analyze Leaf</button>

      <!-- Spinner -->
      <div class="spinner" id="spinner"></div>

      <!-- Error -->
      <div id="error-box"></div>

      <!-- Result -->
      <div id="result">
        <div id="status-badge"></div>
        <div class="result-label" id="result-label"></div>
        <div class="result-conf" id="result-conf"></div>
        <hr class="divider" />
        <div class="advice-title" id="advice-title"></div>
        <div id="advice-text"></div>
      </div>
    </div>
  </div>
</div>

{% include 'chat_widget.html' %}

<script>
const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');
const previewWrap = document.getElementById('preview-wrap');
const previewImg = document.getElementById('preview-img');
const fileNameEl = document.getElementById('file-name');
const analyzeBtn = document.getElementById('analyze-btn');
const spinner = document.getElementById('spinner');
const resultDiv = document.getElementById('result');
const errorBox = document.getElementById('error-box');
const cameraBtn = document.getElementById('camera-btn');
const galleryBtn = document.getElementById('gallery-btn');
const cameraContainer = document.getElementById('camera-container');
const cameraVideo = document.getElementById('camera-video');
const captureBtn = document.getElementById('capture-btn');
const cancelCameraBtn = document.getElementById('cancel-camera-btn');

let selectedFile = null;
let cameraStream = null;

function showPreview(file) {
  selectedFile = file;
  const url = URL.createObjectURL(file);
  previewImg.src = url;
  fileNameEl.textContent = file.name || 'Captured Image';
  previewWrap.style.display = 'block';
  analyzeBtn.disabled = false;
  resultDiv.style.display = 'none';
  errorBox.style.display = 'none';
  hideCamera();
}

function hideCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }
  cameraContainer.style.display = 'none';
  cameraVideo.srcObject = null;
}

function showCamera() {
  dropZone.style.display = 'none';
  document.querySelector('.upload-options').style.display = 'none';
  cameraContainer.style.display = 'block';

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      cameraStream = stream;
      cameraVideo.srcObject = stream;
    })
    .catch(err => {
      console.error('Camera access denied:', err);
      errorBox.textContent = '⚠️ Camera access denied. Please allow camera permissions.';
      errorBox.style.display = 'block';
      hideCamera();
      dropZone.style.display = 'block';
      document.querySelector('.upload-options').style.display = 'flex';
    });
}

function captureImage() {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = cameraVideo.videoWidth;
  canvas.height = cameraVideo.videoHeight;
  ctx.drawImage(cameraVideo, 0, 0);

  canvas.toBlob(blob => {
    const file = new File([blob], 'captured-leaf.jpg', { type: 'image/jpeg' });
    showPreview(file);
    dropZone.style.display = 'block';
    document.querySelector('.upload-options').style.display = 'flex';
  }, 'image/jpeg', 0.9);
}

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) showPreview(e.target.files[0]);
});

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  dropZone.classList.add('drag-over');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) showPreview(e.dataTransfer.files[0]);
});

cameraBtn.addEventListener('click', showCamera);
galleryBtn.addEventListener('click', () => fileInput.click());
captureBtn.addEventListener('click', captureImage);
cancelCameraBtn.addEventListener('click', () => {
  hideCamera();
  dropZone.style.display = 'block';
  document.querySelector('.upload-options').style.display = 'flex';
});

analyzeBtn.addEventListener('click', async () => {
  if (!selectedFile) return;

  analyzeBtn.disabled = true;
  spinner.style.display = 'block';
  resultDiv.style.display = 'none';
  errorBox.style.display = 'none';

  const formData = new FormData();
  formData.append('image', selectedFile);

  try {
    const res = await fetch('/api/disease/predict', { method: 'POST', body: formData });
    const data = await res.json();

    spinner.style.display = 'none';


  } catch (err) {
    spinner.style.display = 'none';
    errorBox.textContent = '⚠️ Network error. Please try again.';
    errorBox.style.display = 'block';
    analyzeBtn.disabled = false;
  }
});

// Load user info
async function loadUserInfo() {
  try {
    const res = await fetch('/api/session');
    const data = await res.json();
    if (data.logged_in) {
      const avatar = document.getElementById('guide-user-avatar');
      if (avatar) avatar.textContent = (data.name || 'U')[0].toUpperCase();
      const uname = document.getElementById('dash-username');
      if (uname) uname.textContent = data.name || 'User';
    }
  } catch (e) {
    console.log('Could not load user info');
  }
}

loadUserInfo();
</script>

</body>
</html>
