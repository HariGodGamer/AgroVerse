<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot - AgroVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald: #00e5a0;
      --teal: #00c9b1;
      --cyan: #00d4ff;
      --bg-dark: #050e0a;
      --bg-mid: #091a12;
      --bg-card: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(0, 229, 160, 0.15);
      --text-main: #e8f5ee;
      --text-muted: #7aa390;
      --sidebar-w: 220px;
      --topbar-h: 68px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(0, 229, 160, 0.14), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(0, 212, 255, 0.12), transparent 24%),
        linear-gradient(180deg, #07110c 0%, #04110b 100%);
      color: var(--text-main);
      min-height: 100vh;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(12px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 280px;
      height: 280px;
      right: -80px;
      top: 12%;
      background: radial-gradient(circle, rgba(0, 229, 160, 0.14), transparent 70%);
    }

    body::after {
      width: 220px;
      height: 220px;
      left: -60px;
      bottom: 10%;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.12), transparent 72%);
    }

    .page-shell {
      position: relative;
      z-index: 1;
      margin-left: var(--sidebar-w);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: var(--sidebar-w);
      right: 0;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(5, 14, 10, 0.92);
      border-bottom: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      z-index: 100;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 22px;
      cursor: pointer;
    }

    .topbar-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .topbar-kicker {
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.6px;
      font-weight: 700;
    }

    .topbar-title {
      font-family: "Syne", sans-serif;
      font-size: 20px;
      font-weight: 800;
    }

    .topbar-title span {
      background: linear-gradient(90deg, var(--emerald), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px 14px;
      background: var(--bg-card);
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: var(--emerald);
      border-color: rgba(0, 229, 160, 0.35);
    }

    .chatbot-stage {
      padding-top: var(--topbar-h);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ChatGPT-style Chat Layout */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background: transparent;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 160, 0.15);
      border-radius: 99px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 229, 160, 0.3);
    }

    .chat-message-row {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      animation: messageFadeIn 0.3s ease forwards;
    }

    @keyframes messageFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-message-row.user {
      flex-direction: row-reverse;
    }

    .chat-msg-avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      user-select: none;
    }

    .chat-message-row.bot .chat-msg-avatar {
      background: linear-gradient(135deg, var(--emerald), var(--teal));
      color: #050e0a;
      box-shadow: 0 0 16px rgba(0, 229, 160, 0.25);
    }

    .chat-message-row.user .chat-msg-avatar {
      background: linear-gradient(135deg, var(--cyan), #0088ff);
      color: #ffffff;
      box-shadow: 0 0 16px rgba(0, 136, 255, 0.25);
    }

    .chat-msg-content-wrapper {
      max-width: 72%;
      display: flex;
      flex-direction: column;
    }

    .chat-message-row.user .chat-msg-content-wrapper {
      align-items: flex-end;
    }

    .chat-msg-bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-main);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      word-break: break-word;
    }

    .chat-message-row.bot .chat-msg-bubble {
      background: rgba(11, 28, 22, 0.7);
      border: 1px solid var(--glass-border);
      border-top-left-radius: 4px;
      backdrop-filter: blur(8px);
    }

    .chat-message-row.user .chat-msg-bubble {
      background: linear-gradient(135deg, rgba(0, 229, 160, 0.16), rgba(0, 212, 255, 0.1));
      border: 1px solid rgba(0, 229, 160, 0.25);
      border-top-right-radius: 4px;
      backdrop-filter: blur(8px);
    }

    .chat-msg-time {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 5px;
      padding: 0 4px;
    }

    /* Welcome / Empty State */
    .chat-welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: auto;
      max-width: 680px;
      width: 100%;
      padding: 40px 0;
      animation: welcomeFadeIn 0.5s ease-out;
    }

    @keyframes welcomeFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .welcome-avatar {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--emerald), var(--teal));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 24px;
      box-shadow: 0 0 32px rgba(0, 229, 160, 0.35);
      animation: floatWelcome 4s ease-in-out infinite;
    }

    @keyframes floatWelcome {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .welcome-title {
      font-family: "Syne", sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .welcome-title span {
      background: linear-gradient(90deg, var(--emerald), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 480px;
      margin-bottom: 40px;
    }

    .welcome-suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      padding: 0 10px;
    }

    .suggestion-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
      color: var(--text-main);
      font-family: inherit;
      border: 1px solid var(--glass-border);
    }

    .suggestion-card:hover {
      background: rgba(0, 229, 160, 0.05);
      border-color: rgba(0, 229, 160, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 229, 160, 0.08);
    }

    .suggestion-icon {
      font-size: 20px;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(0, 229, 160, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--emerald);
    }

    .suggestion-text {
      flex: 1;
    }

    .suggestion-text strong {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 3px;
    }

    .suggestion-text span {
      display: block;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Input Area */
    .chat-input-area {
      padding: 16px 24px 24px;
      background: linear-gradient(180deg, transparent, rgba(5, 14, 10, 0.95) 45%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      z-index: 10;
    }

    .chat-input-wrapper {
      width: 100%;
      max-width: 800px;
      background: rgba(9, 26, 18, 0.85);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 8px 12px 8px 18px;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .chat-input-wrapper:focus-within {
      border-color: rgba(0, 229, 160, 0.4);
      box-shadow: 0 10px 40px rgba(0, 229, 160, 0.08);
    }

    .chat-input-wrapper textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      resize: none;
      min-height: 24px;
      max-height: 160px;
      padding: 8px 0;
    }

    .chat-input-wrapper textarea::placeholder {
      color: var(--text-muted);
    }

    .chat-send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--emerald), var(--teal));
      color: #050e0a;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      margin-bottom: 2px;
    }

    .chat-send-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.25s;
    }

    .chat-send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(0, 229, 160, 0.4);
    }

    .chat-send-btn:disabled {
      background: rgba(255, 255, 255, 0.06) !important;
      color: var(--text-muted) !important;
      cursor: not-allowed;
      box-shadow: none !important;
      transform: none !important;
      opacity: 0.6;
    }

    .chat-disclaimer {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      opacity: 0.75;
    }

    /* Typing Indicator */
    .typing-bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 4px 6px;
    }

    .typing-bubble span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      opacity: 0.6;
      animation: typingDots 1.4s infinite;
    }

    .typing-bubble span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-bubble span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingDots {
      0%, 80%, 100% { transform: scale(1); opacity: 0.6; }
      40% { transform: scale(1.4); opacity: 1; }
    }

    /* Responsive Adjustments */
    @media (max-width: 900px) {
      .topbar {
        left: 0;
      }

      .menu-toggle {
        display: inline-flex;
      }

      .page-shell {
        margin-left: 0;
      }

      .chatbot-stage {
        padding: var(--topbar-h) 0 0 0 !important;
      }

      .chat-messages {
        padding: 24px 16px;
      }

      .chat-input-area {
        padding: 12px 16px 16px;
      }
    }

    @media (max-width: 600px) {
      .welcome-title {
        font-size: 26px;
      }

      .welcome-suggestions-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .chat-msg-content-wrapper {
        max-width: 85%;
      }
    }
  </style>
</head>
<body>
  {% include 'sidebar.html' %}

  <div class="page-shell">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle">&#9776;</button>
      <div class="topbar-meta">
        <span class="topbar-kicker">AI Support</span>
        <div class="topbar-title">AgroBot <span>Assistant</span></div>
      </div>
      <a href="/dashboard" class="back-link">Back to Dashboard</a>
    </header>

    <main class="chatbot-stage">
      <div class="chat-container">
        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages">
          
          <!-- Empty State Screen -->
          <div class="chat-welcome" id="chatWelcome">
            <div class="welcome-avatar">&#x1F916;</div>
            <h1 class="welcome-title">I'm AgroBot, your <span>Farming Expert</span></h1>
            <p class="welcome-subtitle">Ask me about crops, pests, irrigation, weather planning, or market timing.</p>
            
            <div class="welcome-suggestions-grid">
              <button class="suggestion-card" type="button" onclick="setInputValue('Best crops for Kharif season?')">
                <span class="suggestion-icon">&#x1F33E;</span>
                <div class="suggestion-text">
                  <strong>Kharif Crops</strong>
                  <span>Best varieties & planting tips</span>
                </div>
              </button>
              
              <button class="suggestion-card" type="button" onclick="setInputValue('How to detect crop diseases?')">
                <span class="suggestion-icon">&#x1F52C;</span>
                <div class="suggestion-text">
                  <strong>Disease Guidance</strong>
                  <span>Spotting common crop issues</span>
                </div>
              </button>
              
              <button class="suggestion-card" type="button" onclick="setInputValue('Current weather tips for farming?')">
                <span class="suggestion-icon">&#x1F324;&#xFE0F;</span>
                <div class="suggestion-text">
                  <strong>Weather Planning</strong>
                  <span>Irrigation & field work advice</span>
                </div>
              </button>
              
              <button class="suggestion-card" type="button" onclick="setInputValue('When is a good time to sell my crop?')">
                <span class="suggestion-icon">&#x1F4CA;</span>
                <div class="suggestion-text">
                  <strong>Market Timing</strong>
                  <span>Price trends & selling window</span>
                </div>
              </button>
            </div>
          </div>

        </div>

        <!-- Sticky Bottom Input -->
        <div class="chat-input-area">
          <div class="chat-input-wrapper">
            <textarea id="chatInput" placeholder="Ask AgroBot about farming..." rows="1"></textarea>
            <button class="chat-send-btn" id="chatSendBtn" type="button" title="Send message" disabled>
              <svg viewBox="0 0 24 24">
                <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2" />
              </svg>
            </button>
          </div>
          <div class="chat-disclaimer">
            AgroBot can make mistakes. Verify important farming details.
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const messages = document.getElementById('chatMessages');
      const welcome = document.getElementById('chatWelcome');
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('chatSendBtn');

      let chatHistory = [];

      function escapeHtml(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatTime(date) {
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
      }

      function addMessage(role, text) {
        if (welcome) {
          welcome.style.display = 'none';
        }

        const div = document.createElement('div');
        const safeText = escapeHtml(text).replace(/\n/g, '<br>');
        const isBot = role === 'bot';
        div.className = 'chat-message-row ' + role;
        div.innerHTML = `
          <div class="chat-msg-avatar">${isBot ? '&#x1F916;' : '&#x1F464;'}</div>
          <div class="chat-msg-content-wrapper">
            <div class="chat-msg-bubble">${safeText}</div>
            <div class="chat-msg-time">${formatTime(new Date())}</div>
          </div>
        `;
        messages.appendChild(div);
        scrollToBottom();
      }

      function showTyping() {
        const div = document.createElement('div');
        div.className = 'chat-message-row bot';
        div.id = 'chatTypingIndicator';
        div.innerHTML = `
          <div class="chat-msg-avatar">&#x1F916;</div>
          <div class="chat-msg-content-wrapper">
            <div class="chat-msg-bubble" style="padding: 12px 16px;">
              <div class="typing-bubble"><span></span><span></span><span></span></div>
            </div>
          </div>
        `;
        messages.appendChild(div);
        scrollToBottom();
      }

      function hideTyping() {
        const el = document.getElementById('chatTypingIndicator');
        if (el) el.remove();
      }

      async function sendMessage(text) {
        const message = (text || '').trim();
        if (!message) return;

        addMessage('user', message);
        chatHistory.push({ role: 'user', content: message });
        
        input.value = '';
        input.style.height = 'auto';
        sendBtn.disabled = true;
        
        showTyping();

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, history: chatHistory.slice(-10) })
          });
          const data = await response.json();
          hideTyping();
          
          const reply = data.reply || data.error || 'No response received.';
          addMessage('bot', reply);
          chatHistory.push({ role: 'assistant', content: reply });
        } catch (error) {
          hideTyping();
          addMessage('bot', 'Could not reach AgroBot right now. Please try again.');
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      }

      function setInputValue(text) {
        input.value = text;
        input.dispatchEvent(new Event('input'));
        sendMessage(text);
      }

      // Input adjustments
      input.addEventListener('input', () => {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
        sendBtn.disabled = input.value.trim() === '';
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage(input.value);
        }
      });

      window.setInputValue = setInputValue;

      // Autofocus
      setTimeout(() => {
        input.focus();
      }, 100);

    })();
  </script>
</body>
</html>
