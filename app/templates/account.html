<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings — AgroVerse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald: #00e5a0;
      --teal: #00c9b1;
      --cyan: #00d4ff;
      --bg-dark: #050e0a;
      --bg-mid: #091a12;
      --bg-card: rgba(255,255,255,0.03);
      --glass: rgba(0,229,160,0.06);
      --glass-border: rgba(0,229,160,0.15);
      --text-main: #e8f5ee;
      --text-muted: #7aa390;
      --sidebar-w: 220px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow-x: hidden;
    }

    .main-area {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* TOP BAR */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--glass-border);
      background: var(--bg-dark);
      flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .back-btn {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: 9px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; transition: all 0.2s;
      text-decoration: none; color: var(--text-main);
    }
    .back-btn:hover { background: var(--glass); border-color: rgba(0,229,160,0.3); }
    .topbar h1 {
      font-family: 'Syne', sans-serif;
      font-size: 20px; font-weight: 700;
    }
    .topbar h1 span {
      background: linear-gradient(90deg, var(--emerald), var(--cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* CONTENT */
    .content-area {
      flex: 1; overflow-y: auto;
      padding: 32px 28px 48px;
      background: radial-gradient(ellipse 60% 40% at 70% 20%, rgba(0,229,160,0.04) 0%, transparent 60%);
    }
    .content-area::-webkit-scrollbar { width: 4px; }
    .content-area::-webkit-scrollbar-thumb { background: rgba(0,229,160,0.25); border-radius: 10px; }

    .page-max { max-width: 680px; }

    /* PROFILE HERO */
    .profile-hero {
      background: linear-gradient(135deg, rgba(0,40,28,0.85), rgba(5,14,10,0.95));
      border: 1px solid rgba(0,229,160,0.15);
      border-radius: 20px;
      padding: 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .profile-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 60% 80% at 90% 50%, rgba(0,229,160,0.06), transparent);
      pointer-events: none;
    }
    .profile-avatar-lg {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--emerald), var(--teal));
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif;
      font-size: 26px; font-weight: 800;
      color: #050e0a;
      flex-shrink: 0;
      box-shadow: 0 0 24px rgba(0,229,160,0.3);
      position: relative;
    }
    .online-dot-lg {
      position: absolute;
      right: -3px; bottom: -3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #4ade80;
      border: 2.5px solid var(--bg-dark);
    }
    .profile-hero-info h2 {
      font-family: 'Syne', sans-serif;
      font-size: 20px; font-weight: 700;
      margin-bottom: 4px;
    }
    .profile-hero-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .profile-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(0,229,160,0.1);
      border: 1px solid rgba(0,229,160,0.2);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      color: var(--emerald);
      font-weight: 600;
    }

    /* SETTINGS CARDS */
    .settings-card {
      background: var(--bg-card);
      border: 1px solid rgba(0,229,160,0.08);
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 18px;
    }
    .settings-card-title {
      font-family: 'Syne', sans-serif;
      font-size: 15px; font-weight: 700;
      margin-bottom: 18px;
      display: flex; align-items: center; gap: 8px;
    }
    .settings-card-title::before {
      content: '•';
      color: var(--emerald);
      font-size: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .form-row.full { grid-template-columns: 1fr; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label {
      font-size: 11px; font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .form-group input,
    .form-group select {
      background: rgba(0,229,160,0.03);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group select option {
      background: var(--bg-mid);
      color: var(--text-main);
    }
    .form-group input:focus,
    .form-group select:focus { border-color: rgba(0,229,160,0.4); }
    .form-group input::placeholder { color: var(--text-muted); }
    .form-group input:read-only {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .sensor-live-badge {
      display: flex; align-items: center; gap: 8px;
      color: var(--emerald); font-weight: 600;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      display: inline-block;
    }
    .live-dot.pulse {
      animation: livePulse 1.8s infinite alternate;
    }
    @keyframes livePulse {
      0% { transform: scale(0.9); opacity: 0.5; box-shadow: 0 0 4px var(--emerald); }
      100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 12px var(--emerald); }
    }

    /* Buttons */
    .btn-save {
      padding: 11px 24px;
      background: linear-gradient(135deg, var(--emerald), var(--teal));
      border: none; border-radius: 10px;
      color: #050e0a;
      font-family: 'Syne', sans-serif;
      font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.25s;
      letter-spacing: 0.3px;
    }
    .btn-save:hover { box-shadow: 0 6px 20px rgba(0,229,160,0.4); transform: translateY(-1px); }
    .btn-save:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-danger {
      padding: 11px 24px;
      background: transparent;
      border: 1px solid rgba(255,80,80,0.3);
      border-radius: 10px;
      color: #ff8a8a;
      font-family: 'Syne', sans-serif;
      font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.25s;
    }
    .btn-danger:hover { background: rgba(255,80,80,0.08); border-color: rgba(255,80,80,0.5); }

    .btn-row {
      display: flex; gap: 10px;
      margin-top: 18px;
      align-items: center;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg-mid);
      border: 1px solid var(--glass-border);
      border-radius: 12px; padding: 12px 20px;
      font-size: 13px; z-index: 600;
      display: flex; align-items: center; gap: 8px;
      transition: transform 0.35s cubic-bezier(0.23,1,0.32,1);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      min-width: 220px; text-align: center; justify-content: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(0,229,160,0.35); color: var(--emerald); }
    .toast.error   { border-color: rgba(255,80,80,0.35); color: #ff8a8a; }

    @media (max-width: 768px) {
      .main-area { margin-left: 0; }
      .topbar, .content-area { padding-left: 16px; padding-right: 16px; }
      .form-row { grid-template-columns: 1fr; }
      .profile-hero { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>

{% include 'sidebar.html' %}

<div class="main-area">
  <div class="topbar">
    <div class="topbar-left">
      <a href="/dashboard" class="back-btn" title="Back to Dashboard">←</a>
      <h1>Account <span>Settings</span></h1>
    </div>
    <a href="/logout" style="color:var(--text-muted);text-decoration:none;font-size:13px;border:1px solid var(--glass-border);padding:7px 14px;border-radius:8px;transition:all 0.2s;" onmouseover="this.style.color='#ff8a8a';this.style.borderColor='rgba(255,80,80,0.35)'" onmouseout="this.style.color='var(--text-muted)';this.style.borderColor='var(--glass-border)'">🚪 Logout</a>
  </div>

  <div class="content-area">
    <div class="page-max">

      <!-- Profile Hero -->
      <div class="profile-hero">
        <div class="profile-avatar-lg" id="accountAvatar">U<div class="online-dot-lg"></div></div>
        <div class="profile-hero-info">
          <h2 id="accountName">Loading...</h2>
          <p id="accountEmail">—</p>
          <div class="profile-badge">🌱 AgroVerse Farmer</div>
        </div>
      </div>

      <!-- Profile Settings -->
      <div class="settings-card">
        <div class="settings-card-title">Profile Information</div>
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="Your first name">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Your last name">
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="emailField" placeholder="Email" readonly>
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phoneField" placeholder="+91 00000 00000">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-save" id="saveProfileBtn" onclick="saveProfile()">Save Changes</button>
        </div>
      </div>

      <!-- Farm & Soil Settings -->
      <div class="settings-card">
        <div class="settings-card-title">🚜 Farm &amp; Soil Intelligence</div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Land Owned (Acres)</label>
            <input type="number" id="landOwnedField" step="0.1" min="0" placeholder="e.g. 5.5">
          </div>
          <div class="form-group">
            <label>Soil Sensor Device</label>
            <select id="deviceField" onchange="toggleDeviceMode()">
              <option value="none">No Device Connected (Manual Mode)</option>
              <option value="probe">IoT Soil Probe (Simulated Live)</option>
              <option value="node">AgroSense Node v3 (Simulated Live)</option>
            </select>
          </div>
        </div>

        <div id="sensorStatusBlock" style="margin-top: 14px; margin-bottom: 14px; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 12px;">
          <!-- Populated by JS -->
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Soil Moisture (%)</label>
            <input type="number" id="soilMoistureField" min="0" max="100" placeholder="e.g. 35">
          </div>
          <div class="form-group">
            <label>Nitrogen (N) (mg/kg)</label>
            <input type="number" id="soilNField" min="0" placeholder="e.g. 80">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Phosphorus (P) (mg/kg)</label>
            <input type="number" id="soilPField" min="0" placeholder="e.g. 45">
          </div>
          <div class="form-group">
            <label>Potassium (K) (mg/kg)</label>
            <input type="number" id="soilKField" min="0" placeholder="e.g. 150">
          </div>
        </div>

        <div class="btn-row">
          <button class="btn-save" id="saveFarmBtn" onclick="saveFarmSettings()">Save Farm Settings</button>
        </div>
      </div>

      <!-- Password Settings -->
      <div class="settings-card">
        <div class="settings-card-title">Change Password</div>
        <div class="form-row full">
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Minimum 6 characters">
          </div>
        </div>
        <div class="form-row full">
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter new password">
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-save" id="savePasswordBtn" onclick="savePassword()">Update Password</button>
        </div>
      </div>

      <!-- Danger Zone -->
      <div class="settings-card">
        <div class="settings-card-title">Session</div>
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px;">Sign out of your AgroVerse account on this device.</p>
        <a href="/logout" class="btn-danger" style="display:inline-block;text-decoration:none;text-align:center;">🚪 Sign Out</a>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

{% include 'chat_widget.html' %}

<script>
// ── Load session data ─────────────────────────────────────────────────────────
fetch('/api/session')
  .then(r => r.json())
  .then(data => {
    if (!data.logged_in) { window.location.href = '/signin'; return; }
    const name  = data.name  || 'User';
    const email = data.email || '';
    const phone = data.phone || '';

    document.getElementById('accountAvatar').firstChild.textContent = (name[0] || 'U').toUpperCase();
    document.getElementById('accountName').textContent  = name;
    document.getElementById('accountEmail').textContent = email;
    document.getElementById('emailField').value  = email;
    document.getElementById('phoneField').value  = phone;

    const parts = name.split(' ');
    document.getElementById('firstName').value = parts[0] || '';
    document.getElementById('lastName').value  = parts.slice(1).join(' ') || '';

    // Sync sidebar elements
    const sidebarName = document.getElementById('dash-username');
    if (sidebarName) sidebarName.textContent = name;
    const sidebarAvatar = document.getElementById('guide-user-avatar');
    if (sidebarAvatar) sidebarAvatar.textContent = (name[0] || 'U').toUpperCase();

    // Load farm settings
    document.getElementById('landOwnedField').value = data.land_owned || '0';
    document.getElementById('deviceField').value = data.device_connected || 'none';
    document.getElementById('soilMoistureField').value = data.soil_moisture || '0';
    document.getElementById('soilNField').value = data.soil_n || '0';
    document.getElementById('soilPField').value = data.soil_p || '0';
    document.getElementById('soilKField').value = data.soil_k || '0';
    
    toggleDeviceMode();
  })
  .catch(() => { window.location.href = '/signin'; });

// ── Save profile ──────────────────────────────────────────────────────────────
async function saveProfile() {
  const firstName = document.getElementById('firstName').value.trim();
  const lastName  = document.getElementById('lastName').value.trim();
  const phone     = document.getElementById('phoneField').value.trim();

  if (!firstName) { showToast('First name is required.', 'error'); return; }
  if (phone && (!/^\d{10}$/.test(phone))) { showToast('Phone must be exactly 10 digits.', 'error'); return; }

  const fullName = [firstName, lastName].filter(Boolean).join(' ');
  const btn = document.getElementById('saveProfileBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    const res  = await fetch('/api/account/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: fullName, phone: phone || undefined })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('accountName').textContent = fullName;
      document.getElementById('accountAvatar').firstChild.textContent = (firstName[0] || 'U').toUpperCase();
      const sn = document.getElementById('dash-username');
      if (sn) sn.textContent = fullName;
      const sa = document.getElementById('guide-user-avatar');
      if (sa) sa.textContent = (firstName[0] || 'U').toUpperCase();
      showToast('✅ Profile updated successfully!', 'success');
    } else {
      showToast('❌ ' + (data.message || 'Update failed.'), 'error');
    }
  } catch (err) {
    showToast('❌ Network error. Please try again.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Changes';
  }
}

// ── Change password ───────────────────────────────────────────────────────────
async function savePassword() {
  const newPwd  = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;

  if (!newPwd || newPwd.length < 6) { showToast('Password must be at least 6 characters.', 'error'); return; }
  if (newPwd !== confirm) { showToast('Passwords do not match.', 'error'); return; }

  const btn = document.getElementById('savePasswordBtn');
  btn.disabled = true; btn.textContent = 'Updating...';

  try {
    const res  = await fetch('/api/account/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: newPwd, confirm_password: confirm })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('newPassword').value    = '';
      document.getElementById('confirmPassword').value = '';
      showToast('✅ Password updated!', 'success');
    } else {
      showToast('❌ ' + (data.message || 'Failed to update password.'), 'error');
    }
  } catch (err) {
    showToast('❌ Network error. Please try again.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Update Password';
  }
}

// ── Toast ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ── Farm & Soil Simulation and Save ──────────────────────────────────────────
let sensorTimer = null;
function startSensorSimulation() {
  if (sensorTimer) clearInterval(sensorTimer);
  sensorTimer = setInterval(() => {
    const dev = document.getElementById('deviceField').value;
    if (dev === 'none') return;
    
    const mEl = document.getElementById('soilMoistureField');
    const nEl = document.getElementById('soilNField');
    const pEl = document.getElementById('soilPField');
    const kEl = document.getElementById('soilKField');
    
    if (mEl) {
      let val = parseFloat(mEl.value) || 30;
      val = Math.max(10, Math.min(95, val + (Math.random() - 0.5) * 1.5));
      mEl.value = val.toFixed(1);
    }
    if (nEl) {
      let val = parseFloat(nEl.value) || 60;
      val = Math.max(10, val + (Math.random() - 0.5) * 2);
      nEl.value = val.toFixed(1);
    }
    if (pEl) {
      let val = parseFloat(pEl.value) || 40;
      val = Math.max(10, val + (Math.random() - 0.5) * 1.5);
      pEl.value = val.toFixed(1);
    }
    if (kEl) {
      let val = parseFloat(kEl.value) || 120;
      val = Math.max(10, val + (Math.random() - 0.5) * 3);
      kEl.value = val.toFixed(1);
    }
  }, 3000);
}

function toggleDeviceMode() {
  const dev = document.getElementById('deviceField').value;
  const statusBlock = document.getElementById('sensorStatusBlock');
  const mEl = document.getElementById('soilMoistureField');
  const nEl = document.getElementById('soilNField');
  const pEl = document.getElementById('soilPField');
  const kEl = document.getElementById('soilKField');
  
  if (dev === 'none') {
    if (sensorTimer) clearInterval(sensorTimer);
    statusBlock.style.background = 'rgba(255,255,255,0.02)';
    statusBlock.style.border = '1px solid var(--glass-border)';
    statusBlock.innerHTML = `
      <span style="color: var(--text-muted);">Mode: <strong>Manual Input Mode</strong></span>
      <span style="color: var(--text-muted); font-size: 11px;">Values are manually editable below.</span>
    `;
    [mEl, nEl, pEl, kEl].forEach(el => {
      if (el) el.readOnly = false;
    });
  } else {
    statusBlock.style.background = 'rgba(0, 229, 160, 0.05)';
    statusBlock.style.border = '1px solid rgba(0, 229, 160, 0.2)';
    const devName = dev === 'probe' ? 'IoT Soil Probe' : 'AgroSense Node v3';
    statusBlock.innerHTML = `
      <div class="sensor-live-badge">
        <span class="live-dot pulse"></span>
        <span>${devName} Connected</span>
      </div>
      <span style="color: var(--emerald); font-weight: 500;">Live Sensor Feed Active (Read-Only)</span>
    `;
    [mEl, nEl, pEl, kEl].forEach(el => {
      if (el) el.readOnly = true;
    });
    
    if (!mEl.value || parseFloat(mEl.value) === 0) mEl.value = (Math.random() * 25 + 25).toFixed(1);
    if (!nEl.value || parseFloat(nEl.value) === 0) nEl.value = (Math.random() * 30 + 50).toFixed(1);
    if (!pEl.value || parseFloat(pEl.value) === 0) pEl.value = (Math.random() * 20 + 35).toFixed(1);
    if (!kEl.value || parseFloat(kEl.value) === 0) kEl.value = (Math.random() * 50 + 120).toFixed(1);
    
    startSensorSimulation();
  }
}

async function saveFarmSettings() {
  const landOwned = document.getElementById('landOwnedField').value.trim();
  const deviceConnected = document.getElementById('deviceField').value;
  const soilMoisture = document.getElementById('soilMoistureField').value.trim();
  const soilN = document.getElementById('soilNField').value.trim();
  const soilP = document.getElementById('soilPField').value.trim();
  const soilK = document.getElementById('soilKField').value.trim();

  const btn = document.getElementById('saveFarmBtn');
  btn.disabled = true; btn.textContent = 'Saving...';

  try {
    const res = await fetch('/api/account/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        land_owned: landOwned || '0',
        device_connected: deviceConnected,
        soil_moisture: soilMoisture || '0',
        soil_n: soilN || '0',
        soil_p: soilP || '0',
        soil_k: soilK || '0'
      })
    });
    const data = await res.json();
    if (data.success) {
      showToast('✅ Farm & Soil Settings saved successfully!', 'success');
    } else {
      showToast('❌ ' + (data.message || 'Update failed.'), 'error');
    }
  } catch (err) {
    showToast('❌ Network error. Please try again.', 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Save Farm Settings';
  }
}
</script>
</body>
</html>
